# Publish to npm when a version tag is pushed.
#
# Authentication: npm trusted publishing (OIDC) only. The workflow proves its
# identity to the registry (hence `permissions.id-token: write`); there is no
# token secret and nothing to log in to. The trust relationship is configured
# once per package (npm-oidc-setup.sh, or npmjs.com -> package -> Settings ->
# Trusted Publisher -> GitHub Actions, this repository, release.yml).
#
# Every release publishes straight to `latest`, prereleases included: in this
# 0.x line each rc is the version users should get, and OIDC can only set the
# tag of the publish itself (moving a dist-tag afterwards would need a login).
#
# This mirrors dsh-ios/dsh-android's release.yml. The gate is deliberately
# `test:ci`, not `test`: the full suite needs a granted macOS Computer Helper
# that no runner has, and a release must never be gated on a check that cannot
# pass. The Computer acceptance is a human step before tagging.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The bundled npm predates trusted publishing.
      - run: npm install -g npm@11

      - name: Materialize the driver siblings from the registry
        run: bash .github/scripts/fetch-drivers.sh

      - run: pnpm install --frozen-lockfile

      # The tag must match what is about to be published, or the release
      # silently ships a version nobody asked for.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Build and run the hosted-runner suites
        run: pnpm run build && pnpm run test:ci

      # Publishing is skipped when the registry already has this version. npm
      # refuses to publish over an existing version, so without the guard a
      # re-pushed tag — or a version first published by hand — turns the
      # release red for a reason nobody needs to act on.
      #
      # `--ignore-scripts` is required, not a shortcut: `prepublishOnly` runs
      # `smoke:pack`, whose `prepack` gate is the FULL `npm test` — including
      # the Computer acceptance that needs a granted macOS helper. On a runner
      # that step cannot pass, so the gates run explicitly in the step above
      # and the publish itself skips the lifecycle. The tarball is built from
      # the `lib/` produced there.
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          pkg="$(node -p "require('./package.json').version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "$name@$pkg is already on the registry — nothing to publish."
            exit 0
          fi
          npm publish --access public --ignore-scripts --tag latest
